version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Supply-chain cooldown (2026-06-10, prompted by the Miasma worm wave):
    # wait 7 days after a release before proposing it as a version bump.
    # Worm-published malicious versions are typically detected and yanked
    # within days, so the cooldown keeps the weekly bumps behind that hot
    # window. Dependabot SECURITY updates ignore cooldown entirely, so
    # advisory fixes (and the auto-merge workflow that lands patch/minor
    # ones) are unaffected.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "server"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # 1.x is an ESM-only rewrite (top-level await) with the same product
      # list — no 153/154, so the super-res shim would need rewriting for
      # nothing. Stay on 0.6 until a release adds native N0B/N0G support.
      - dependency-name: "nexrad-level-3-data"
        update-types: ["version-update:semver-major"]
    groups:
      server-dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      server-prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
      day: "monday"
    # 7-day supply-chain cooldown — rationale on the server npm entry above.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "client"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # ESLint 10 removed context.getFilename(); eslint-plugin-react 7.x
      # still calls it (peer range ends at ^9.7), so the build's lint step
      # crashes. Lift once eslint-plugin-react declares ESLint 10 support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      client-dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      client-prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # 7-day supply-chain cooldown — rationale on the server npm entry above.
    # (github-actions only supports default-days, not the semver-* variants.)
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
